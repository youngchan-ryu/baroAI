[project]
name = "baroai-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "pillow>=13,<14",
  "pillow-heif==1.8.1",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.13,<5",
  "arq==0.28.0",
  "ortools==9.15.6755",
  "cryptography>=46,<47",
  "openpyxl>=3.1.5,<3.2",
  "defusedxml>=0.7.1,<0.8",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "qrcode==8.2",
    "ruff>=0.9,<1",
]
[tool.vercel]
entrypoint = "app.vercel:app"
[tool.vercel.fastapi.static]
cdn = false
[tool.vercel.scripts]
build = "python scripts/build_vercel_frontend.py"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: isolated PostgreSQL tests (requires TEST_DATABASE_URL)"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
